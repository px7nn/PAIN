[app]
name    = "PAIN"
version = "0.0.1"
debug   = true

[paths]
llama_dir   = "/home/px7nn/main/AI/llama.cpp"
model_dir   = "models"
personality = "models/personality"
data_dir    = "data"
log_dir     = "logs"

[models."Gemma 4 E4B"]
file         = "gemma-4-E4B-it-Q4_K_M.gguf"
role         = "Study"
quantization = "Q4_K_M"
personality  = "PAIN.txt"
context_size = 16384

[models."Qwen3.5-4B"]
file         = "Qwen3.5-4B-Q4_K_M.gguf"
role         = "Research analysis"
quantization = "Q4_K_M"
personality  = "PAIN.txt"
context_size = 16384

[models."LFM2.5-2.6B"]
file         = "LFM2.5-2.6B-Q4_K_M.gguf"
role         = "Research agent"
quantization = "Q4_K_M"
personality  = "PAIN.txt"
context_size = 16384

[models."Qwen2.5-Coder-7B"]
file         = "Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf"
role         = "Coding"
quantization = "Q4_K_M"
personality  = "PAIN.txt"
context_size = 16384

[models."Granite 4.2 3B"]
file         = "granite-4.2-3b-Q4_K_M.gguf"
role         = "Agent/tool-use alternative"
quantization = "Q4_K_M"
personality  = "PAIN.txt"
context_size = 16384

[inference]
default_model = "Qwen3.5-4B"
threads       = 8
gpu_layers    = 99
flash_attn    = "on"
cache_type_k  = "q8_0"
cache_type_v  = "q8_0"
max_tokens    = 4096
temperature   = 0.35
top_p         = 0.8
top_k         = 20
min_p         = 0.0

[resources]
max_concurrent_inference = 1
max_concurrent_tasks     = 1
